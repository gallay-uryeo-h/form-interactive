<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <title>내 데이터 - form-interactive</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#006a39",
            "primary-container": "#008649",
            "primary-fixed": "#82faab",
            "on-primary-fixed": "#00210e",
            "on-primary": "#ffffff",
            "secondary": "#0058bb",
            "secondary-container": "#1471e6",
            "secondary-fixed": "#d8e2ff",
            "on-secondary-fixed": "#001a41",
            "tertiary": "#8d4b00",
            "surface": "#f7fafd",
            "surface-dim": "#d7dade",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f1f4f7",
            "surface-container": "#ebeef2",
            "surface-container-high": "#e5e8ec",
            "surface-container-highest": "#e0e3e6",
            "surface-variant": "#e0e3e6",
            "on-surface": "#181c1f",
            "on-surface-variant": "#3e4a3f",
            "outline": "#6d7a6f",
            "outline-variant": "#bdcabc",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a"
          },
          fontFamily: {
            "sans": ["Inter", "sans-serif"],
            "mono": ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>
  <style>
    @layer base {
      html, body { width: 100%; margin: 0; padding: 0; }
      body { overscroll-behavior-y: none; }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    }
  </style>
</head>
<body class="bg-surface text-on-surface flex flex-col min-h-screen font-sans">

  <!-- Mobile Top Navigation Header -->
  <header class="fixed top-0 w-full z-50 pt-safe bg-surface/90 backdrop-blur-md shadow-xs border-b border-surface-container">
    <div class="h-14 px-3 flex items-center justify-between gap-2 bg-surface-container-lowest">
      <div class="flex items-center gap-2 min-w-0">
        <!-- 시트 입력 화면일 때만 뒤로가기 표시 -->
        <a id="backBtn" href="mobile.html" class="hidden w-8 h-8 items-center justify-center rounded-full text-on-surface hover:bg-surface-container transition-colors" title="목록으로">
          <span class="material-symbols-outlined text-[20px]">arrow_back</span>
        </a>
        <div class="flex flex-col min-w-0">
          <div class="flex items-center gap-1.5">
            <span class="text-[15px] font-semibold text-on-surface truncate max-w-[150px] sm:max-w-xs" id="pageTitle">내 데이터</span>
            <span class="material-symbols-outlined text-[16px] text-primary" id="saveIcon" style="display:none">cloud_done</span>
            <span class="text-[11px] text-outline font-medium truncate" id="saveText"></span>
          </div>
        </div>
      </div>

      <!-- 구글 로그인 영역 (오른쪽 위) -->
      <div class="flex items-center gap-1.5">
        <!-- 로그아웃 상태: 로그인 버튼 -->
        <button id="btnGoogleLogin" type="button"
          class="flex items-center gap-1.5 h-8 px-2.5 rounded-full border border-[#dadce0] bg-white text-[#3c4043] text-[12px] font-medium hover:bg-[#f8f9fa] shadow-2xs transition-colors"
          title="구글 계정으로 로그인">
          <svg viewBox="0 0 24 24" width="15" height="15">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span>로그인</span>
        </button>

        <!-- 로그인 상태: 아바타 + 드롭다운 -->
        <div id="userAvatarArea" class="hidden relative">
          <button id="userAvatarBtn" type="button"
            class="w-8 h-8 rounded-full bg-[#ea4335] text-white flex items-center justify-center font-bold text-[12px] shrink-0 shadow-xs hover:ring-2 hover:ring-[#ea4335]/40 transition-all"
            title="구글 계정">
            <span id="userAvatarInitial">G</span>
          </button>
          <div id="userDropdown"
            class="hidden absolute right-0 top-10 w-56 bg-white border border-surface-container rounded-xl shadow-lg p-1 z-50">
            <div class="px-3 py-2.5 border-b border-surface-container mb-1">
              <p class="text-[12px] font-semibold text-on-surface truncate" id="dropdownName">사용자</p>
              <p class="text-[10px] text-outline font-mono truncate" id="dropdownEmail">user@gmail.com</p>
            </div>
            <button type="button" id="btnLogout"
              class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-[12px] text-error hover:bg-error-container transition-colors">
              <span class="material-symbols-outlined text-[15px]">logout</span>
              로그아웃
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ────────── 시트 목록 화면 ────────── -->
  <main id="viewSheetList" class="hidden flex-col w-full pt-16 pb-20 bg-surface flex-1 max-w-md mx-auto px-3">
    <div class="py-3 text-[12px] text-outline flex items-center gap-1">
      <span class="material-symbols-outlined text-[14px]">folder_shared</span>
      <span>내게 배정된 시트 목록</span>
    </div>
    <div id="sheetListContainer" class="flex flex-col gap-3">
      <div class="py-12 text-center text-outline">
        <span class="inline-block animate-spin mr-2">⏳</span> 시트 목록을 불러오는 중...
      </div>
    </div>
  </main>

  <!-- ────────── 내 입력(카드) 화면 ────────── -->
  <main id="viewCards" class="hidden flex-col w-full pt-16 pb-20 bg-surface flex-1 max-w-md mx-auto px-3">
    <div class="flex items-center justify-between py-2 text-[12px] text-outline">
      <span id="filteredCountLabel">로딩 중...</span>
      <span class="text-primary font-mono text-[11px]">실시간 동기화</span>
    </div>
    <div class="flex flex-col gap-3" id="cardsContainer">
      <div class="py-12 text-center text-outline">
        <span class="inline-block animate-spin mr-2">⏳</span> 데이터를 불러오는 중...
      </div>
    </div>
  </main>

  <!-- ────────── 로그인 안내 화면 ────────── -->
  <main id="viewLogin" class="hidden flex-col w-full pt-16 pb-20 flex-1 items-center justify-center max-w-md mx-auto px-3">
    <div class="flex flex-col items-center gap-4 py-16 text-center">
      <span class="material-symbols-outlined text-[48px] text-outline">account_circle</span>
      <p class="text-[14px] font-semibold text-on-surface">로그인이 필요합니다</p>
      <p class="text-[12px] text-outline">구글 계정으로 로그인하면<br>내게 배정된 시트를 확인할 수 있습니다.</p>
      <button id="btnLoginBig" type="button"
        class="flex items-center gap-2 h-10 px-5 rounded-full border border-[#dadce0] bg-white text-[#3c4043] text-[13px] font-medium hover:bg-[#f8f9fa] shadow transition-colors mt-2">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        구글 계정으로 로그인
      </button>
    </div>
  </main>

  <!-- Mobile Bottom Tab Bar — 내 입력 + 홈/목록 2개만 -->
  <nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/90 backdrop-blur-md border-t border-surface-container">
    <div class="max-w-md mx-auto flex justify-around items-center h-14 px-3 bg-surface-container-lowest">
      <a id="tabMyInput" href="mobile.html" class="flex flex-col items-center justify-center min-w-[72px] text-on-surface-variant hover:text-on-surface">
        <span class="material-symbols-outlined text-[20px]">edit_note</span>
        <span class="text-[10px] mt-0.5">내 입력</span>
      </a>
      <a id="tabHome" href="mobile.html" class="flex flex-col items-center justify-center min-w-[72px] text-primary font-semibold">
        <span class="material-symbols-outlined text-[20px]">folder_shared</span>
        <span class="text-[10px] mt-0.5">홈/목록</span>
      </a>
    </div>
  </nav>

  <script type="module">
    import {
      subscribeTasks,
      subscribeColumnConfigs,
      subscribeSheets,
      subscribeColumnOrder,
      updateTask,
      getTasksForSheet,
      DEFAULT_COLUMN_CONFIGS
    } from "./firebase-service.js";

    import {
      onAuthStateChanged,
      signInWithGoogle,
      signOut,
      getCurrentUser
    } from "./auth-service.js";

    // ─────────────────────────────────────────
    //  URL 파라미터 — sheetId 있으면 내 입력 화면, 없으면 목록 화면
    // ─────────────────────────────────────────
    const urlParams      = new URLSearchParams(window.location.search);
    const currentSheetId = urlParams.get("sheetId"); // null이면 목록 화면

    // ─────────────────────────────────────────
    //  상태
    // ─────────────────────────────────────────
    let allTasks           = [];
    let allSheets          = [];
    let columnConfigs      = {};
    let currentColumnOrder = [];
    let currentUser        = null;
    let saveTimeout        = null;

    // ─────────────────────────────────────────
    //  DOM refs
    // ─────────────────────────────────────────
    const viewLogin        = document.getElementById("viewLogin");
    const viewSheetList    = document.getElementById("viewSheetList");
    const viewCards        = document.getElementById("viewCards");
    const sheetListContainer = document.getElementById("sheetListContainer");
    const cardsContainer   = document.getElementById("cardsContainer");
    const filteredCountLabel = document.getElementById("filteredCountLabel");
    const saveIcon         = document.getElementById("saveIcon");
    const saveText         = document.getElementById("saveText");
    const pageTitle        = document.getElementById("pageTitle");
    const backBtn          = document.getElementById("backBtn");
    const btnGoogleLogin   = document.getElementById("btnGoogleLogin");
    const btnLoginBig      = document.getElementById("btnLoginBig");
    const userAvatarArea   = document.getElementById("userAvatarArea");
    const userAvatarBtn    = document.getElementById("userAvatarBtn");
    const userAvatarInitial = document.getElementById("userAvatarInitial");
    const userDropdown     = document.getElementById("userDropdown");
    const dropdownName     = document.getElementById("dropdownName");
    const dropdownEmail    = document.getElementById("dropdownEmail");
    const btnLogout        = document.getElementById("btnLogout");
    const tabMyInput       = document.getElementById("tabMyInput");
    const tabHome          = document.getElementById("tabHome");

    // ─────────────────────────────────────────
    //  화면 전환
    // ─────────────────────────────────────────
    function showView(name) {
      viewLogin.classList.add("hidden");     viewLogin.classList.remove("flex");
      viewSheetList.classList.add("hidden"); viewSheetList.classList.remove("flex");
      viewCards.classList.add("hidden");     viewCards.classList.remove("flex");

      if (name === "login") {
        viewLogin.classList.remove("hidden"); viewLogin.classList.add("flex");
        pageTitle.textContent = "내 데이터";
        backBtn.classList.add("hidden"); backBtn.classList.remove("flex");
        saveIcon.style.display = "none";
        saveText.textContent = "";
        // 탭: 홈 강조
        setTabActive("home");
      } else if (name === "list") {
        viewSheetList.classList.remove("hidden"); viewSheetList.classList.add("flex");
        pageTitle.textContent = "내 데이터";
        backBtn.classList.add("hidden"); backBtn.classList.remove("flex");
        saveIcon.style.display = "none";
        saveText.textContent = "";
        setTabActive("home");
      } else if (name === "cards") {
        viewCards.classList.remove("hidden"); viewCards.classList.add("flex");
        backBtn.classList.remove("hidden"); backBtn.classList.add("flex");
        saveIcon.style.display = "";
        setTabActive("input");
      }
    }

    function setTabActive(tab) {
      const activeClass = ["text-primary", "font-semibold"];
      const inactiveClass = ["text-on-surface-variant"];
      if (tab === "input") {
        tabMyInput.classList.add(...activeClass);
        tabMyInput.classList.remove(...inactiveClass);
        tabHome.classList.remove(...activeClass);
        tabHome.classList.add(...inactiveClass);
      } else {
        tabHome.classList.add(...activeClass);
        tabHome.classList.remove(...inactiveClass);
        tabMyInput.classList.remove(...activeClass);
        tabMyInput.classList.add(...inactiveClass);
      }
    }

    // ─────────────────────────────────────────
    //  Auth
    // ─────────────────────────────────────────
    async function doLogin() {
      try {
        await signInWithGoogle();
      } catch (err) {
        if (err.code !== "auth/popup-closed-by-user") {
          alert("로그인 실패: " + err.message);
        }
      }
    }

    btnGoogleLogin.addEventListener("click", doLogin);
    btnLoginBig.addEventListener("click", doLogin);

    userAvatarBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      userDropdown.classList.toggle("hidden");
    });
    btnLogout.addEventListener("click", async () => {
      userDropdown.classList.add("hidden");
      await signOut();
    });
    document.addEventListener("click", () => userDropdown.classList.add("hidden"));

    // ─────────────────────────────────────────
    //  Auth 상태 변경 → 화면 결정
    // ─────────────────────────────────────────
    onAuthStateChanged((user) => {
      currentUser = user;
      if (!user) {
        // 미로그인
        btnGoogleLogin.classList.remove("hidden");
        userAvatarArea.classList.add("hidden");
        showView("login");
        return;
      }
      // 로그인됨
      btnGoogleLogin.classList.add("hidden");
      userAvatarArea.classList.remove("hidden");
      userAvatarInitial.textContent = user.initial || user.email?.charAt(0).toUpperCase() || "G";
      dropdownName.textContent  = user.displayName || user.email;
      dropdownEmail.textContent = user.email;

      if (currentSheetId) {
        // sheetId 있음 → 내 입력 화면
        showView("cards");
        renderCards();
      } else {
        // sheetId 없음 → 시트 목록
        showView("list");
        renderSheetList();
      }
    });

    // ─────────────────────────────────────────
    //  Firestore 구독 (시트 목록용)
    // ─────────────────────────────────────────
    // 모든 시트 정보 구독 (목록 화면에서 필요)
    let sheetColConfigs = {}; // { sheetId: { colKey: cfg, ... } }
    let sheetColOrders  = {}; // { sheetId: [key, ...] }
    let sheetTasksCache = {}; // { sheetId: [task, ...] }

    subscribeSheets((sheets) => {
      allSheets = sheets || [];
      if (!currentSheetId && currentUser) {
        renderSheetList();
      }
      // 현재 시트 제목 업데이트 (내 입력 화면)
      if (currentSheetId) {
        const cur = allSheets.find(s => s.id === currentSheetId);
        if (cur) {
          document.title = `${cur.name} - form-interactive`;
          pageTitle.textContent = cur.name;
        }
      }
    });

    // ─────────────────────────────────────────
    //  내 입력 화면용 Firestore 구독 (sheetId 있을 때만)
    // ─────────────────────────────────────────
    if (currentSheetId) {
      subscribeTasks((tasks) => {
        allTasks = tasks;
        renderCards();
      }, (err) => console.error(err), currentSheetId);

      subscribeColumnConfigs((configs) => {
        columnConfigs = configs || {};
        renderCards();
      }, currentSheetId);

      subscribeColumnOrder((order) => {
        currentColumnOrder = order || [];
        renderCards();
      }, currentSheetId);
    }

    // ─────────────────────────────────────────
    //  이메일 정규화 — 대소문자·공백 무시 비교용
    // ─────────────────────────────────────────
    function normalizeEmail(email) {
      return (email || "").trim().toLowerCase();
    }

    // ─────────────────────────────────────────
    //  시트 목록 렌더
    //  · googleId 타입 열이 있는 시트만
    //  · 그 열에 내 이메일이 있는 시트만 (대소문자 무시)
    //  · getTasksForSheet — 전체 컬렉션 대신 sheetId query 사용
    // ─────────────────────────────────────────
    async function renderSheetList() {
      if (!currentUser || !allSheets.length) return;

      sheetListContainer.innerHTML = `<div class="py-12 text-center text-outline"><span class="inline-block animate-spin mr-2">⏳</span> 내 시트를 확인하는 중...</div>`;

      const myEmail = normalizeEmail(currentUser.email);

      const checks = await Promise.all(allSheets.map(async (sheet) => {
        try {
          const colCfg = await fetchOnce_colConfig(sheet.id);
          const gColKey = Object.keys(colCfg).find(k => colCfg[k]?.type === "googleId");
          if (!gColKey) return null; // googleId 열 없음 → 제외

          // getTasksForSheet: sheetId 쿼리 — 전체 컬렉션 읽기 불필요
          const tasks = await getTasksForSheet(sheet.id);
          const myRows = tasks.filter(t =>
            normalizeEmail(t[gColKey]) === myEmail
          );
          if (!myRows.length) return null; // 내 이메일 없음 → 제외

          return { sheet, gColKey, colCfg, myCount: myRows.length };
        } catch (e) {
          console.warn("시트 확인 오류:", sheet.id, e.message || e);
          return null;
        }
      }));

      const mySheets = checks.filter(Boolean);

      if (!mySheets.length) {
        sheetListContainer.innerHTML = `
          <div class="bg-surface-container-lowest rounded-xl p-8 text-center text-outline border border-surface-container flex flex-col items-center gap-2">
            <span class="material-symbols-outlined text-[36px]">search_off</span>
            <span class="text-[13px] font-semibold text-on-surface">배정된 시트가 없습니다</span>
            <span class="text-[11px]"><strong>${currentUser.email}</strong> 계정으로<br>배정된 데이터가 없습니다.<br>관리자에게 문의하세요.</span>
          </div>`;
        return;
      }

      sheetListContainer.innerHTML = mySheets.map(({ sheet, myCount }) => `
        <a href="mobile.html?sheetId=${encodeURIComponent(sheet.id)}"
          class="flex items-center gap-3 bg-surface-container-lowest rounded-xl border border-surface-container shadow-xs p-4 hover:border-primary/40 hover:shadow-sm transition-all active:scale-[0.98]">
          <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-[20px] text-primary">table_chart</span>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-[14px] font-semibold text-on-surface truncate">${sheet.name || sheet.id}</p>
            <p class="text-[11px] text-outline mt-0.5 flex items-center gap-1">
              <span class="material-symbols-outlined text-[12px]">edit_note</span>
              내 항목 ${myCount}건
            </p>
          </div>
          <span class="material-symbols-outlined text-[20px] text-outline">chevron_right</span>
        </a>
      `).join("");
    }

    // ─────────────────────────────────────────
    //  1회성 colConfig fetch (subscribeColumnConfigs 래핑)
    // ─────────────────────────────────────────
    function fetchOnce_colConfig(sheetId) {
      return new Promise((resolve) => {
        let unsub;
        unsub = subscribeColumnConfigs((cfg) => {
          if (unsub) { try { unsub(); } catch {} }
          resolve(cfg || {});
        }, sheetId);
      });
    }

    // ─────────────────────────────────────────
    //  Column helpers (내 입력 화면용)
    // ─────────────────────────────────────────
    function getColumnsToRender() {
      const keys = (currentColumnOrder && currentColumnOrder.length)
        ? currentColumnOrder
        : Object.keys(columnConfigs);
      return keys.map(k => {
        const cfg = columnConfigs[k] || {};
        return { key: k, label: cfg.label || k, icon: "edit_note" };
      });
    }

    function getFieldSpan(colKey, type) {
      if (colKey === "department" || colKey === "project" || colKey === "task") return "col-span-12";
      if (type === "priority" || colKey === "priority") return "col-span-12";
      return "col-span-6";
    }

    function getIdentityColumn() {
      const gColKey = Object.keys(columnConfigs).find(k => columnConfigs[k]?.type === "googleId");
      if (gColKey) return { key: gColKey, label: columnConfigs[gColKey]?.label || "구글 아이디", isGoogleId: true };
      return null;
    }

    // ─────────────────────────────────────────
    //  Save indicator
    // ─────────────────────────────────────────
    function indicateSaving() {
      saveIcon.textContent = "sync";
      saveIcon.classList.add("animate-spin");
      saveText.textContent = "저장 중...";
      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(() => {
        saveIcon.textContent = "cloud_done";
        saveIcon.classList.remove("animate-spin");
        saveText.textContent = "자동 저장됨";
      }, 800);
    }

    // ─────────────────────────────────────────
    //  Render field
    // ─────────────────────────────────────────
    function renderField(t, col) {
      const cfg    = columnConfigs[col.key] || DEFAULT_COLUMN_CONFIGS[col.key] || { type: "text" };
      const type   = cfg.type || "text";
      const label  = cfg.label || col.label;
      const rawVal = t[col.key];
      const val    = rawVal != null ? String(rawVal) : "";
      const span   = getFieldSpan(col.key, type);

      switch (type) {

        case "locked":
          return `
            <div class="${span} flex flex-col gap-1">
              <div class="flex flex-col bg-surface-container-low/80 px-2.5 py-1.5 rounded-lg border border-surface-container justify-center h-[58px]">
                <div class="flex items-center justify-between text-[10px] text-outline">
                  <span class="flex items-center gap-1 font-medium truncate">
                    <span class="material-symbols-outlined text-[13px]">${col.icon}</span>${label}
                  </span>
                  <span class="material-symbols-outlined text-[12px] text-outline shrink-0">lock</span>
                </div>
                <p class="text-[12px] text-on-surface font-semibold leading-tight truncate mt-0.5">${val || "-"}</p>
              </div>
            </div>`;

        case "text":
          return `
            <div class="${span} flex flex-col gap-1">
              <label class="text-[11px] text-on-surface-variant font-semibold flex items-center gap-1 truncate">
                <span class="material-symbols-outlined text-[13px] text-primary">${col.icon}</span>${label}
              </label>
              <input type="text" value="${val}"
                class="w-full h-[38px] bg-surface-container-lowest text-on-surface text-[12px] px-2.5 rounded-lg border border-surface-container focus:border-secondary outline-none shadow-2xs"
                onchange="window.saveField('${t.id}','${col.key}',this.value)">
            </div>`;

        case "select": {
          const opts = (cfg.options && cfg.options.length) ? cfg.options : ["진행중", "완료", "대기", "보류"];
          const allOpts = [...opts];
          if (val && !allOpts.includes(val)) allOpts.unshift(val);
          return `
            <div class="${span} flex flex-col gap-1">
              <label class="text-[11px] text-on-surface-variant font-semibold flex items-center gap-1 truncate">
                <span class="material-symbols-outlined text-[13px] text-secondary">${col.icon}</span>${label}
              </label>
              <div class="relative">
                <select
                  class="w-full h-[38px] appearance-none bg-surface-container-lowest text-on-surface font-mono text-[11px] font-semibold px-2.5 rounded-lg border border-surface-container focus:border-secondary outline-none pr-6 shadow-2xs cursor-pointer"
                  onchange="window.saveField('${t.id}','${col.key}',this.value)">
                  ${allOpts.map(o => `<option value="${o}" ${o === val ? "selected" : ""}>${o}</option>`).join("")}
                </select>
                <span class="material-symbols-outlined absolute right-1.5 top-1/2 -translate-y-1/2 text-[16px] text-outline pointer-events-none">arrow_drop_down</span>
              </div>
            </div>`;
        }

        case "date": {
          const dateVal = val.match(/\d{4}-\d{2}-\d{2}/) ? val.match(/\d{4}-\d{2}-\d{2}/)[0] : (val || "");
          return `
            <div class="${span} flex flex-col gap-1">
              <label class="text-[11px] text-on-surface-variant font-semibold flex items-center gap-1 truncate">
                <span class="material-symbols-outlined text-[13px] text-outline">${col.icon}</span>${label}
              </label>
              <div class="flex items-center h-[38px] bg-surface-container-lowest border border-surface-container rounded-lg px-2 shadow-2xs">
                <input type="date" value="${dateVal}"
                  class="w-full bg-transparent font-mono text-[11px] text-on-surface outline-none font-medium cursor-pointer"
                  onchange="window.saveField('${t.id}','${col.key}',this.value)">
              </div>
            </div>`;
        }

        case "priority": {
          const pOpts = (cfg.options && cfg.options.length) ? cfg.options : ["높음 (P1)", "보통 (P2)", "낮음 (P3)"];
          return `
            <div class="${span} flex flex-col gap-1">
              <label class="text-[11px] text-on-surface-variant font-semibold flex items-center gap-1 truncate">
                <span class="material-symbols-outlined text-[13px] text-error">${col.icon}</span>${label}
              </label>
              <div class="grid grid-cols-3 gap-1.5">
                ${pOpts.map(p => `
                  <button type="button"
                    class="h-[36px] px-1 rounded-lg text-[11px] font-medium border transition-colors flex items-center justify-center truncate
                      ${val === p ? "bg-secondary-fixed text-on-secondary-fixed font-bold border-secondary/40 shadow-2xs" : "bg-surface-container-lowest text-on-surface-variant border-surface-container hover:bg-surface-container-low"}"
                    onclick="window.saveField('${t.id}','${col.key}','${p}')">${p}</button>
                `).join("")}
              </div>
            </div>`;
        }

        case "checkbox": {
          const isChecked = val === "true" || val === true || val === "1" || val === "승인" || val === "완료";
          return `
            <div class="${span} flex flex-col gap-1">
              <label class="text-[11px] text-on-surface-variant font-semibold flex items-center gap-1 truncate">
                <span class="material-symbols-outlined text-[13px] text-primary">${col.icon}</span>${label}
              </label>
              <label class="flex items-center justify-center h-[38px] px-2.5 rounded-lg bg-surface-container-lowest border border-surface-container shadow-2xs cursor-pointer hover:bg-surface">
                <input type="checkbox" ${isChecked ? "checked" : ""}
                  class="accent-primary w-5 h-5"
                  onchange="window.saveField('${t.id}','${col.key}',this.checked)">
              </label>
            </div>`;
        }

        case "progress": {
          const min    = cfg.min  != null ? cfg.min  : 0;
          const max    = cfg.max  != null ? cfg.max  : 100;
          const unit   = cfg.unit || "%";
          const numVal = Math.min(max, Math.max(min, parseInt(val, 10) || min));
          return `
            <div class="${span} flex flex-col gap-1">
              <div class="flex items-center justify-between">
                <label class="text-[11px] text-on-surface-variant font-semibold flex items-center gap-1 truncate">
                  <span class="material-symbols-outlined text-[13px] text-primary">${col.icon}</span>${label}
                </label>
                <span class="font-mono text-[11px] font-bold text-primary" id="prog-val-${t.id}-${col.key}">${numVal}${unit}</span>
              </div>
              <div class="flex items-center h-[38px] px-2.5 bg-surface-container-lowest border border-surface-container rounded-lg shadow-2xs">
                <input type="range" min="${min}" max="${max}" value="${numVal}"
                  class="w-full accent-primary cursor-pointer"
                  oninput="document.getElementById('prog-val-${t.id}-${col.key}').textContent=this.value+'${unit}'"
                  onchange="window.saveField('${t.id}','${col.key}',Number(this.value))">
              </div>
            </div>`;
        }

        default:
          return `
            <div class="${span} flex flex-col gap-1">
              <label class="text-[11px] text-on-surface-variant font-semibold truncate">${label}</label>
              <input type="text" value="${val}"
                class="w-full h-[38px] bg-surface-container-lowest text-on-surface text-[12px] px-2.5 rounded-lg border border-surface-container focus:border-secondary outline-none shadow-2xs"
                onchange="window.saveField('${t.id}','${col.key}',this.value)">
            </div>`;
      }
    }

    // ─────────────────────────────────────────
    //  Render cards (내 입력 화면)
    //  · googleId 열이 없는 시트 → 접근 불가 안내
    //  · 내 이메일 있는 행만 표시 (readonly 없음, 완전 차단)
    //  · 카드 번호: 내 데이터 순번 (1, 2, 3...)
    // ─────────────────────────────────────────
    function renderCards() {
      if (!currentUser) return;

      const identityCol = getIdentityColumn();

      // googleId 열이 없는 시트 → 접근 불가
      if (!identityCol) {
        cardsContainer.innerHTML = `
          <div class="bg-error-container rounded-xl p-8 text-center border border-error/20 flex flex-col items-center gap-2">
            <span class="material-symbols-outlined text-[36px] text-error">block</span>
            <span class="text-[13px] font-semibold text-on-error-container">접근할 수 없는 시트입니다</span>
            <span class="text-[11px] text-on-error-container/80">이 시트는 사용자 배정 설정이 없습니다.</span>
            <a href="mobile.html" class="mt-2 text-[12px] text-primary underline">목록으로 돌아가기</a>
          </div>`;
        filteredCountLabel.textContent = "";
        return;
      }

      // googleId 열 키 집합 — 카드 필드에서 제외
      const googleIdKeys = new Set(
        Object.keys(columnConfigs).filter(k => columnConfigs[k]?.type === "googleId")
      );
      const colsToRender = getColumnsToRender().filter(col => !googleIdKeys.has(col.key));

      // 내 이메일 행만 필터링 (대소문자·공백 무시, 완전 차단)
      const myEmail = normalizeEmail(currentUser.email);
      const filtered = allTasks.filter(t =>
        normalizeEmail(t[identityCol.key]) === myEmail
      );

      // 카운트 레이블
      filteredCountLabel.innerHTML =
        `<span class="inline-flex items-center gap-1 font-bold text-[#c5221f] bg-[#fce8e6] px-2 py-0.5 rounded-full text-[11px]">
          <span class="material-symbols-outlined text-[13px]">alternate_email</span>${currentUser.email}
        </span>
        <span class="text-on-surface"> 내 항목 (${filtered.length}건)</span>`;

      // 빈 상태
      if (!filtered.length) {
        cardsContainer.innerHTML = `
          <div class="bg-surface-container-lowest rounded-xl p-8 text-center text-outline border border-surface-container flex flex-col items-center gap-2">
            <span class="material-symbols-outlined text-[36px] text-outline">search_off</span>
            <span class="text-[13px] font-semibold text-on-surface">배정된 항목이 없습니다</span>
            <span class="text-[11px]"><strong>${currentUser.email}</strong> 계정에<br>배정된 데이터가 없습니다.</span>
            <a href="mobile.html" class="mt-2 text-[12px] text-primary underline">목록으로 돌아가기</a>
          </div>`;
        return;
      }

      // 카드 렌더 — idx+1이 카드 번호 (내 데이터 순번)
      cardsContainer.innerHTML = filtered.map((t, idx) => {
        const fieldsHtml = colsToRender.map(col => renderField(t, col)).join("");
        const displayStatus = t.status || "";

        return `
          <article class="flex flex-col bg-surface-container-lowest rounded-xl border border-surface-container shadow-xs p-3.5 gap-2.5 transition-all" data-id="${t.id}">
            <div class="flex items-center justify-between pb-1.5 border-b border-surface-container">
              <div class="flex items-center gap-1.5 truncate">
                <span class="font-mono font-bold text-primary px-2 py-0.5 bg-primary-fixed/40 rounded text-[11px] shrink-0">#${idx + 1}</span>
                <span class="font-semibold text-[13px] text-on-surface truncate flex items-center gap-1">
                  <span class="material-symbols-outlined text-[14px] text-primary">edit_note</span>
                  내 항목 ${idx + 1}
                </span>
              </div>
              <div class="flex items-center gap-1 shrink-0">
                <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-primary/10 text-primary font-medium flex items-center gap-0.5">
                  <span class="material-symbols-outlined text-[11px]">edit</span>편집가능
                </span>
                ${displayStatus ? `<span class="text-[11px] px-2 py-0.5 rounded-full font-medium ${
                  displayStatus === "완료" ? "bg-secondary-fixed text-on-secondary-fixed" :
                  displayStatus === "진행중" ? "bg-primary/10 text-primary" : "bg-surface-variant text-on-surface"
                }">${displayStatus}</span>` : ""}
              </div>
            </div>
            <div class="grid grid-cols-12 gap-2">
              ${fieldsHtml}
            </div>
          </article>`;
      }).join("");
    }

    // ─────────────────────────────────────────
    //  Save field
    // ─────────────────────────────────────────
    window.saveField = async (id, field, value) => {
      indicateSaving();
      try {
        await updateTask(id, { [field]: value });
      } catch (err) {
        alert("저장 오류: " + err.message);
      }
    };
  </script>
</body>
</html>

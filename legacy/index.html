<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>form-interactive - Stitch & Firebase Firestore 실시간 연동</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#006a39",
            "primary-container": "#008649",
            "on-primary": "#ffffff",
            "secondary": "#0058bb",
            "surface": "#f7fafd",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f1f4f7",
            "surface-container": "#ebeef2",
            "surface-container-high": "#e5e8ec",
            "on-surface": "#181c1f",
            "on-surface-variant": "#3e4a3f",
            "outline": "#6d7a6f"
          },
          fontFamily: {
            "sans": ["Inter", "sans-serif"],
            "mono": ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  </style>
</head>
<body class="bg-surface text-on-surface font-sans flex flex-col h-screen">

  <!-- Top Global Navigation Bar -->
  <header class="h-14 bg-surface-container-lowest border-b border-surface-container px-4 flex items-center justify-between shrink-0 z-50">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-primary text-on-primary flex items-center justify-center font-bold shadow-xs">
        <span class="material-symbols-outlined text-[20px]">table_chart</span>
      </div>
      <div class="flex flex-col">
        <div class="flex items-center gap-2">
          <span class="font-bold text-[15px] text-on-surface">form-interactive</span>
          <span class="px-2 py-0.5 rounded text-[10px] bg-primary/10 text-primary font-mono font-semibold">Firestore 단일 컬렉션</span>
        </div>
        <span class="text-[11px] text-outline font-mono">projects/10859120725644269802</span>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="flex items-center bg-surface-container-low p-1 rounded-xl border border-surface-container text-[12px] font-medium" id="tabBar">
      <button class="nav-tab active px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-all bg-surface-container-lowest text-primary shadow-xs font-semibold" data-target="admin" data-url="admin.html">
        <span class="material-symbols-outlined text-[16px]">grid_on</span>
        <span>Admin 시트 관리</span>
      </button>
      <button class="nav-tab px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-all text-on-surface-variant hover:text-on-surface" data-target="mobile" data-url="mobile.html">
        <span class="material-symbols-outlined text-[16px]">phone_iphone</span>
        <span>User 모바일 폼</span>
      </button>
      <button class="nav-tab px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-all text-on-surface-variant hover:text-on-surface" data-target="dashboard" data-url="dashboard.html">
        <span class="material-symbols-outlined text-[16px]">insights</span>
        <span>대시보드</span>
      </button>
      <button class="nav-tab px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-all text-on-surface-variant hover:text-on-surface" data-target="home" data-url="home.html">
        <span class="material-symbols-outlined text-[16px]">folder</span>
        <span>시트 목록</span>
      </button>
      <button class="nav-tab px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition-all text-secondary hover:bg-surface-container" data-target="split" title="좌측 시트 + 우측 모바일 동시 보기">
        <span class="material-symbols-outlined text-[16px]">vertical_split</span>
        <span>실시간 분할 뷰</span>
      </button>
    </nav>

    <!-- Open in New Tab & Info -->
    <div class="flex items-center gap-3">
      <a id="btnNewWindow" href="admin.html" target="_blank" class="flex items-center gap-1 text-[11px] px-2.5 py-1 text-on-surface-variant hover:text-primary hover:bg-surface-container rounded-lg border border-surface-container transition-colors" title="현재 화면 새 탭에서 열기">
        <span>새 창 열기</span>
        <span class="material-symbols-outlined text-[13px]">open_in_new</span>
      </a>
      <div class="hidden lg:flex items-center gap-1.5 text-[11px] font-mono text-outline">
        <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
        <span>studio-2726051254-c02c9</span>
      </div>
    </div>
  </header>

  <!-- Viewport Area -->
  <main class="flex-1 relative w-full h-full overflow-hidden bg-surface-container-low" id="viewportArea">
    <!-- Single Frame View (Default) -->
    <iframe id="mainFrame" src="admin.html" class="w-full h-full border-none"></iframe>

    <!-- Split View (Hidden by default) -->
    <div id="splitView" class="hidden w-full h-full flex">
      <!-- Left: Admin Sheet -->
      <div class="flex-1 h-full border-r border-surface-container flex flex-col">
        <div class="h-8 bg-surface-container px-3 flex items-center justify-between text-[11px] text-on-surface font-semibold shrink-0">
          <span class="flex items-center gap-1"><span class="material-symbols-outlined text-[14px] text-primary">grid_on</span>Admin 시트 관리 (웹)</span>
          <a href="admin.html" target="_blank" class="text-primary hover:underline text-[10px]">새 탭으로 열기</a>
        </div>
        <iframe src="admin.html" class="w-full flex-1 border-none"></iframe>
      </div>

      <!-- Right: Mobile View in Device Mockup -->
      <div class="w-[430px] shrink-0 h-full bg-surface-container-high/60 flex flex-col items-center justify-start py-3 overflow-y-auto">
        <div class="text-[11px] font-semibold text-on-surface-variant mb-2 flex items-center gap-1">
          <span class="material-symbols-outlined text-[14px] text-secondary">phone_iphone</span>
          <span>User 모바일 뷰 (실시간 연동 확인)</span>
        </div>
        <!-- Phone Frame Mockup -->
        <div class="w-[390px] h-[780px] bg-surface-container-lowest rounded-[36px] shadow-2xl border-[8px] border-neutral-800 overflow-hidden relative flex flex-col">
          <!-- Dynamic Island / Speaker notch -->
          <div class="h-5 w-full bg-neutral-800 flex items-center justify-center shrink-0">
            <div class="w-20 h-3 bg-neutral-900 rounded-full"></div>
          </div>
          <iframe src="mobile.html" class="w-full flex-1 border-none"></iframe>
        </div>
      </div>
    </div>
  </main>

  <script>
    const tabs = document.querySelectorAll(".nav-tab");
    const mainFrame = document.getElementById("mainFrame");
    const splitView = document.getElementById("splitView");
    const btnNewWindow = document.getElementById("btnNewWindow");

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        tabs.forEach(t => {
          t.classList.remove("active", "bg-surface-container-lowest", "text-primary", "shadow-xs", "font-semibold");
          t.classList.add("text-on-surface-variant");
        });

        tab.classList.add("active", "bg-surface-container-lowest", "text-primary", "shadow-xs", "font-semibold");
        tab.classList.remove("text-on-surface-variant");

        const target = tab.dataset.target;
        if (target === "split") {
          mainFrame.classList.add("hidden");
          splitView.classList.remove("hidden");
          btnNewWindow.href = "admin.html";
        } else {
          splitView.classList.add("hidden");
          mainFrame.classList.remove("hidden");
          mainFrame.src = tab.dataset.url;
          btnNewWindow.href = tab.dataset.url;
        }
      });
    });
  </script>
</body>
</html>
